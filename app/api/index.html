<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>The Relay</title>
<style>body{font:17px system-ui;max-width:850px;margin:60px auto;padding:20px;background:#101827;color:#e8edf5}textarea{width:95%;height:90px;padding:15px;font:inherit}button,select{padding:10px;margin:12px 5px}pre{white-space:pre-wrap;line-height:1.6}small{color:#b0c1da}</style>
<h1>The Relay</h1><p>Evidence from three exact research paper versions.</p><small>Local stand-in by default. Answers contain source-matched excerpts; quote and lexical checks do not prove semantic completeness.</small>
<p><textarea id="q">Why is dot-product attention scaled by the square root of the key dimension?</textarea></p>
<select id="setting"><option>A: 200 tokens / top 3</option><option>B: 500 tokens / top 5</option><option>C: 500 tokens / top 5 / rerank</option></select><button id="ask">Ask</button><button id="cancel">Cancel</button><p id="status"></p><pre id="answer"></pre>
<script>let controller;const el=id=>document.getElementById(id);el('cancel').onclick=()=>controller?.abort();el('ask').onclick=async()=>{controller=new AbortController();el('answer').textContent='';el('status').textContent='Connecting';try{let r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:el('q').value,setting:el('setting').value[0]}),signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);let reader=r.body.getReader(),decoder=new TextDecoder(),pending='';while(true){let {value,done}=await reader.read();if(done)break;pending+=decoder.decode(value,{stream:true});let frames=pending.split('\n\n');pending=frames.pop();for(let frame of frames){let type=frame.match(/event: (.+)/)?.[1],data=frame.match(/data: (.+)/)?.[1];if(!data)continue;let parsed=JSON.parse(data);if(type==='answer')el('answer').textContent+=parsed;if(type==='status')el('status').textContent=parsed;if(type==='metadata')el('status').textContent=parsed.status+' · '+parsed.request_id;if(type==='done')el('status').textContent+=' · complete';}}}catch(e){el('status').textContent=e.name==='AbortError'?'Cancelled':e.message;}};</script></html>
